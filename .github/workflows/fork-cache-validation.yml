name: Fork schema cache validation

on:
  push:
    branches: [test/schema-cache-fallback]

permissions:
  contents: read

jobs:
  build:
    if: github.repository == 'h55n/vscode-yaml'
    timeout-minutes: 30
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-15, windows-2025, ubuntu-24.04]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node 22.13.0
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0

      - name: Install dependencies
        run: npm ci

      - name: Update yaml-language-server
        run: npm i yaml-language-server@next

      - name: Run build
        run: npm run build

      - name: Run Test
        uses: coactions/setup-xvfb@b6b4fcfb9f5a895edadc3bc76318fae0ac17c8b3 #v1.0.1
        with:
          run: npm test

      - name: Run UI Test
        uses: coactions/setup-xvfb@b6b4fcfb9f5a895edadc3bc76318fae0ac17c8b3 #v1.0.1
        with:
          run: npm run ui-test
          options: -screen 0 1920x1080x24

  Smoke-Test-Web:
    if: github.repository == 'h55n/vscode-yaml'
    timeout-minutes: 20
    runs-on: 'ubuntu-24.04'
    steps:
      - uses: actions/checkout@v4
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Update yaml-language-server
        run: npm i yaml-language-server@next
      - name: Build extension
        run: npm run build
      - name: Run tests on web
        run: xvfb-run npm run smoke-test-web

  Smoke-Test-Desktop:
    if: github.repository == 'h55n/vscode-yaml'
    timeout-minutes: 20
    runs-on: 'ubuntu-24.04'
    steps:
      - uses: actions/checkout@v4
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Update yaml-language-server
        run: npm i yaml-language-server@next
      - name: Build extension
        run: npm run build
      - name: Run tests on web
        run: xvfb-run npm run smoke-test
